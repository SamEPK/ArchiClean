<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Client - Banque AVENIR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .chat-window {
      width: 100%;
      max-width: 900px;
      height: 90vh;
      max-height: 700px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 20px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .chat-header h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .advisor-info {
      font-size: 13px;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .login-section {
      padding: 40px;
      text-align: center;
    }

    .login-section h2 {
      font-size: 24px;
      color: #1e293b;
      margin-bottom: 12px;
    }

    .login-section p {
      color: #64748b;
      margin-bottom: 24px;
    }

    .login-form {
      max-width: 400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-form select,
    .login-form input,
    .login-form button {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      font-size: 14px;
    }

    .login-form select:focus,
    .login-form input:focus {
      outline: none;
      border-color: #667eea;
    }

    .login-form button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .login-form button:hover {
      transform: translateY(-2px);
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 70%;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.sent {
      margin-left: auto;
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }

    .message.sent .message-avatar {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .message-content {
      flex: 1;
    }

    .message-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 14px;
    }

    .message.received .message-bubble {
      background: white;
      color: #1e293b;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .message.sent .message-bubble {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .message-time {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
      padding: 0 4px;
    }

    .message.sent .message-time {
      text-align: right;
    }

    .chat-input-area {
      padding: 20px 24px;
      background: white;
      border-top: 1px solid #e2e8f0;
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #f1f5f9;
      border-radius: 24px;
      padding: 8px 16px;
    }

    .input-wrapper input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      padding: 8px;
      outline: none;
      color: #1e293b;
    }

    .input-wrapper input::placeholder {
      color: #94a3b8;
    }

    .send-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
      font-size: 18px;
    }

    .send-btn:hover {
      transform: scale(1.1);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .welcome-message {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
    }

    .welcome-message h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #1e293b;
    }

    .error-message {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 8px;
      margin: 12px;
      font-size: 13px;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="chat-window">
    <div class="chat-header">
      <h1>💬 Messagerie Client - Banque AVENIR</h1>
      <div class="advisor-info">
        <span class="status-indicator"></span>
        <span id="advisorName">Votre conseiller</span>
      </div>
    </div>

    <div id="chatContent">
      <!-- Section de connexion -->
      <div class="login-section" id="loginSection">
        <h2>👋 Bienvenue</h2>
        <p>Sélectionnez votre profil pour commencer la conversation avec votre conseiller</p>
        
        <div class="login-form">
          <select id="clientSelect">
            <option value="">Chargement des clients...</option>
          </select>
          <button onclick="loginAsClient()">Se connecter</button>
        </div>

        <div id="loginError"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let currentClient = null;
    let messages = [];

    // Charger la liste des clients pour le login
    async function loadClientsForLogin() {
      try {
        const response = await fetch(`${API_BASE}/clients`);
        if (!response.ok) {
          throw new Error('Erreur chargement clients');
        }
        
        const data = await response.json();
        const select = document.getElementById('clientSelect');
        
        select.innerHTML = '<option value="">-- Sélectionnez votre profil --</option>' +
          data.map((client, idx) => 
            `<option value="${idx}">${client.firstName} ${client.lastName} (${client.email})</option>`
          ).join('');

        // Stocker les clients
        window.availableClients = data;
      } catch (error) {
        console.error('Erreur:', error);
        document.getElementById('loginError').innerHTML = `
          <div class="error-message">
            ⚠️ Impossible de charger les profils. Vérifiez que le serveur est démarré.
          </div>
        `;
      }
    }

    // Se connecter en tant que client
    function loginAsClient() {
      const select = document.getElementById('clientSelect');
      const selectedIndex = select.value;

      if (!selectedIndex) {
        document.getElementById('loginError').innerHTML = `
          <div class="error-message">⚠️ Veuillez sélectionner un profil</div>
        `;
        return;
      }

      const client = window.availableClients[selectedIndex];
      currentClient = {
        id: client.id,
        firstName: client.firstName || 'Client',
        lastName: client.lastName || '',
        email: client.email,
        initials: `${(client.firstName || 'C')[0]}${(client.lastName || '')[0] || ''}`.toUpperCase()
      };

      // Mettre à jour le nom du conseiller
      document.getElementById('advisorName').textContent = '👤 Sophie Laurent - Votre conseillère';

      // Initialiser les messages
      messages = [
        {
          id: 1,
          sender: 'advisor',
          content: `Bonjour ${currentClient.firstName} ! Je suis Sophie Laurent, votre conseillère. Comment puis-je vous aider aujourd'hui ?`,
          time: new Date(Date.now() - 3600000).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'})
        }
      ];

      // Afficher le chat
      renderChat();
    }

    // Afficher la zone de chat
    function renderChat() {
      document.getElementById('chatContent').innerHTML = `
        <div class="messages-container" id="messagesContainer"></div>

        <div class="chat-input-area">
          <div class="input-wrapper">
            <input type="text" 
                   id="messageInput" 
                   placeholder="Tapez votre message..." 
                   onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">➤</button>
          </div>
        </div>
      `;

      renderMessages();
    }

    // Afficher les messages
    function renderMessages() {
      const container = document.getElementById('messagesContainer');

      if (messages.length === 0) {
        container.innerHTML = `
          <div class="welcome-message">
            <h3>✉️ Nouvelle conversation</h3>
            <p>Commencez par envoyer un message à votre conseiller</p>
          </div>
        `;
        return;
      }

      container.innerHTML = messages.map(msg => `
        <div class="message ${msg.sender === 'client' ? 'sent' : 'received'}">
          <div class="message-avatar">
            ${msg.sender === 'client' ? currentClient.initials : 'SL'}
          </div>
          <div class="message-content">
            <div class="message-bubble">${msg.content}</div>
            <div class="message-time">${msg.time}</div>
          </div>
        </div>
      `).join('');

      // Scroll vers le bas
      container.scrollTop = container.scrollHeight;
    }

    // Gérer la touche Entrée
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    // Envoyer un message
    async function sendMessage() {
      if (!currentClient) return;

      const input = document.getElementById('messageInput');
      const content = input.value.trim();

      if (!content) return;

      // Ajouter le message à la liste
      const newMessage = {
        id: Date.now(),
        sender: 'client',
        content: content,
        time: new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'})
      };

      messages.push(newMessage);

      // Vider l'input
      input.value = '';

      // Rafraîchir l'affichage
      renderMessages();

      // TODO: Envoyer au backend via WebSocket ou API
      try {
        await fetch(`${API_BASE}/api/messaging/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            conversationId: `conv-${currentClient.id}`,
            senderId: currentClient.id,
            content: content
          })
        });
      } catch (error) {
        console.log('Message stocké localement (backend indisponible)');
      }

      // Simuler une réponse du conseiller après 2 secondes
      setTimeout(() => {
        const responses = [
          "Je comprends votre demande. Laissez-moi vérifier cela pour vous.",
          "Merci pour cette information. Je vais pouvoir vous aider.",
          "Parfait ! Je vais traiter votre demande immédiatement.",
          "D'accord, je note votre demande et je reviens vers vous."
        ];
        
        const autoReply = {
          id: Date.now(),
          sender: 'advisor',
          content: responses[Math.floor(Math.random() * responses.length)],
          time: new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'})
        };

        messages.push(autoReply);
        renderMessages();
      }, 2000);
    }

    // Initialisation
    document.addEventListener('DOMContentLoaded', () => {
      loadClientsForLogin();
    });
  </script>
</body>
</html>
